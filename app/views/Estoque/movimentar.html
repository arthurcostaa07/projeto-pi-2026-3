
#{extends 'main.html' /}
#{set title:'Movimentar estoque' /}

<div class="container py-4">
    <h1 class="text-success mb-2">Movimentar estoque</h1>
    <p class="text-muted">Registre uma entrada ou saída de medicamentos.</p>

    #{if flash.error}
        <div class="alert alert-danger">${flash.error}</div>
    #{/if}

    <div class="card shadow-sm">
        <div class="card-body">
            <form action="@{Estoque.salvarMovimentacao()}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Medicamento</label>
                    <select name="medicamentoId" class="form-select" required>
                        <option value="">Selecione um medicamento</option>
                        #{list items:medicamentos, as:'medicamento'}
                            <option value="${medicamento.id}">
                                ${medicamento.nome} — Estoque atual: ${medicamento.qtEstoque}
                            </option>
                        #{/list}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo de movimentação</label>
                    <select name="tipo" class="form-select" required>
                        <option value="">Selecione</option>
                        <option value="ENTRADA">Entrada / Reposição</option>
                        <option value="SAIDA">Saída de estoque</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantidade</label>
                    <input type="number" name="quantidade"
                           class="form-control" min="1" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Observação</label>
                    <textarea name="observacao" class="form-control"
                              rows="3" placeholder="Ex.: reposição recebida do fornecedor"></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Registrar movimentação
                </button>
                <a href="@{Estoque.listar()}" class="btn btn-outline-secondary">
                    Cancelar
                </a>
            </form>
        </div>
    </div>
</div>
