#{extends 'main.html' /}
#{set title:'Cadastrar Medicamento' /}

<div class="card shadow-sm">
    <div class="card-body">

        <h1 class="mb-4">Cadastrar Medicamento</h1>

        #{form @Medicamentos.salvar()}

            <div class="mb-3">
                <label class="form-label">Nome:</label>
                <input type="text" name="medicamento.nome" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descrição:</label>
                <input type="text" name="medicamento.descricao" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Preço:</label>
                <input type="number" name="medicamento.preco" class="form-control" min="0" step="0.01" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantidade em estoque:</label>
                <input type="number" name="medicamento.qtEstoque" class="form-control" min="0" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Categoria:</label>
                <select name="medicamento.categoria.id" class="form-select" required>
                    <option value="">Selecione uma categoria</option>
                    #{list items:categorias, as:'categoria'}
                        <option value="${categoria.id}">${categoria.nome}</option>
                    #{/list}
                </select>
            </div>

            <button class="btn btn-success" type="submit">Salvar</button>
            <a href="@{Medicamentos.listar()}" class="btn btn-secondary">Voltar</a>

        #{/form}
    </div>
</div>
