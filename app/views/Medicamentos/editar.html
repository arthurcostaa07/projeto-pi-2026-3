#{extends 'main.html' /}
#{set title:'Editar Medicamento' /}

<div class="card shadow-sm">
    <div class="card-body">

        <h1 class="mb-4">Editar Medicamento</h1>

        #{form @Medicamentos.atualizar()}

            <input type="hidden" name="medicamento.id" value="${medicamento.id}">

            <div class="mb-3">
                <label class="form-label">Nome:</label>
                <input type="text" name="medicamento.nome" value="${medicamento.nome}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Descrição:</label>
                <input type="text" name="medicamento.descricao" value="${medicamento.descricao}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Preço:</label>
                <input type="number" name="medicamento.preco" value="${medicamento.preco}" class="form-control" min="0" step="0.01" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantidade em estoque:</label>
                <input type="number" name="medicamento.qtEstoque" value="${medicamento.qtEstoque}" class="form-control" min="0" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Categoria:</label>
                <select name="medicamento.categoria.id" class="form-select" required>
                    #{list items:categorias, as:'categoria'}
                        <option value="${categoria.id}"
                            ${medicamento.categoria?.id == categoria.id ? 'selected' : ''}>
                            ${categoria.nome}
                        </option>
                    #{/list}
                </select>
            </div>

            <button class="btn btn-primary" type="submit">Atualizar</button>
            <a href="@{Medicamentos.listar()}" class="btn btn-secondary">Voltar</a>

        #{/form}
    </div>
</div>
